<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <rect width="1000" height="650" fill="#000000" />
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">

    <!-- Top Dotted Curve Arch to Warehouse -->
    <path d="M 280 250 C 350 140 450 110 500 110 C 550 110 650 140 720 250" stroke-width="2" stroke-dasharray="6 6" opacity="0.8" />

    <!-- Top Warehouse Icon -->
    <path d="M 450 150 L 500 115 L 550 150 L 550 190 L 450 190 Z" stroke-width="2.5" />
    <rect x="475" y="165" width="20" height="15" stroke-width="2" />
    <rect x="505" y="165" width="20" height="15" stroke-width="2" />
    <rect x="490" y="145" width="20" height="15" stroke-width="2" />

    <!-- Center Monitor Screen -->
    <rect x="320" y="210" width="360" height="230" rx="16" stroke-width="4" />
    <path d="M 460 440 L 440 480 L 560 480 L 540 440" stroke-width="3" />
    <path d="M 430 480 L 570 480" stroke-width="3.5" />

    <!-- Monitor Content -->
    <!-- Title -->
    <text x="350" y="248" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="2" stroke="none">INVENTORY</text>
    <line x1="350" y1="260" x2="650" y2="260" stroke-width="1.5" opacity="0.4" />

    <!-- Item 1: Apple -->
    <circle cx="370" cy="285" r="9" stroke-width="2" />
    <line x1="395" y1="285" x2="440" y2="285" stroke-width="3" />
    <text x="490" y="290" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" stroke="none">120</text>
    <circle cx="530" cy="285" r="7" stroke-width="1.5" />
    <path d="M 526 285 L 529 288 L 534 282" stroke-width="1.5" />

    <!-- Item 2: Milk -->
    <rect x="364" y="310" width="12" height="16" rx="2" stroke-width="2" />
    <line x1="395" y1="318" x2="440" y2="318" stroke-width="3" />
    <text x="490" y="323" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" stroke="none">85</text>
    <circle cx="530" cy="318" r="7" stroke-width="1.5" />
    <path d="M 526 318 L 529 321 L 534 315" stroke-width="1.5" />

    <!-- Item 3: Bread -->
    <path d="M 362 352 C 362 344 378 344 378 352 Z" stroke-width="2" />
    <line x1="395" y1="350" x2="440" y2="350" stroke-width="3" />
    <text x="490" y="355" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" stroke="none">60</text>
    <circle cx="530" cy="350" r="7" stroke-width="1.5" />
    <path d="M 526 350 L 529 353 L 534 347" stroke-width="1.5" />

    <!-- Divider Line in Monitor -->
    <line x1="560" y1="270" x2="560" y2="410" stroke-width="1.5" opacity="0.4" />

    <!-- Right side of monitor: Bar chart & Pie chart -->
    <rect x="580" y="300" width="10" height="40" stroke-width="2" fill="#ffffff" />
    <rect x="596" y="285" width="10" height="55" stroke-width="2" fill="#ffffff" />
    <rect x="612" y="315" width="10" height="25" stroke-width="2" fill="#ffffff" />
    <rect x="628" y="275" width="10" height="65" stroke-width="2" fill="#ffffff" />

    <circle cx="610" cy="380" r="22" stroke-width="2.5" />
    <path d="M 610 358 L 610 380 L 632 380 Z" stroke-width="2" fill="#ffffff" />

    <!-- Left Circle: Barcode Scanner -->
    <circle cx="240" cy="300" r="45" stroke-width="3" />
    <!-- Barcode lines -->
    <line x1="215" y1="285" x2="215" y2="315" stroke-width="4" />
    <line x1="223" y1="285" x2="223" y2="315" stroke-width="2" />
    <line x1="229" y1="285" x2="229" y2="315" stroke-width="5" />
    <line x1="238" y1="285" x2="238" y2="315" stroke-width="2" />
    <line x1="244" y1="285" x2="244" y2="315" stroke-width="4" />
    <line x1="252" y1="285" x2="252" y2="315" stroke-width="2" />
    <line x1="258" y1="285" x2="258" y2="315" stroke-width="5" />
    <path d="M 205 280 L 205 275 L 210 275 M 275 280 L 275 275 L 270 275 M 205 320 L 205 325 L 210 325 M 275 320 L 275 325 L 270 325" stroke-width="2.5" />

    <!-- Right Circle: Checklist -->
    <circle cx="760" cy="300" r="45" stroke-width="3" />
    <rect x="738" y="275" width="44" height="50" rx="4" stroke-width="2.5" />
    <path d="M 746 288 L 750 292 L 756 286 M 760 289 L 774 289" stroke-width="2" />
    <path d="M 746 300 L 750 304 L 756 298 M 760 301 L 774 301" stroke-width="2" />
    <path d="M 746 312 L 750 316 L 756 310 M 760 313 L 774 313" stroke-width="2" />
    <circle cx="785" cy="325" r="14" stroke-width="2" fill="#000000" />
    <path d="M 779 325 L 783 329 L 791 321" stroke-width="2.5" />

    <!-- Bottom Left: Cardboard Boxes -->
    <rect x="230" y="440" width="60" height="50" stroke-width="3" />
    <path d="M 230 440 L 260 420 L 320 420 L 290 440 L 290 490 L 230 490 L 230 440 Z" stroke-width="3" />
    <line x1="260" y1="420" x2="260" y2="470" stroke-width="2" />

    <rect x="300" y="455" width="40" height="35" stroke-width="2.5" />
    <path d="M 300 455 L 320 440 L 360 440 L 340 455 L 340 490 L 300 490 Z" stroke-width="2.5" />

    <!-- Bottom Right Circle: Notification Bell -->
    <circle cx="720" cy="460" r="40" stroke-width="3" />
    <path d="M 708 468 C 708 450 712 442 720 442 C 728 442 732 450 732 468 Z" stroke-width="2.5" />
    <path d="M 700 468 L 740 468" stroke-width="3" />
    <circle cx="720" cy="475" r="4" fill="#ffffff" />
    <path d="M 692 450 Q 685 460 690 470 M 748 450 Q 755 460 750 470" stroke-width="2" />

    <!-- Subtext -->
    <text x="500" y="565" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" letter-spacing="3" text-anchor="middle" stroke="none">SMART INVENTORY TRACKING</text>
    <text x="500" y="590" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="5" text-anchor="middle" stroke="none" opacity="0.8">TRACK. MANAGE. DISTRIBUTE.</text>

  </g>
</svg>
